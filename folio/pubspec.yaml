name: folio
description: "Egy nem hivatalos e-KRÉTA kliens, diákoktól diákoknak."
homepage: https://github.com/Pacuka/tinta
publish_to: "none"

version: 1.1.0+42

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  folio_mobile_ui:
    path: "../folio_mobile_ui/"
  folio_kreta_api:
    path: "../folio_kreta_api/"
  flutter_localizations:
    sdk: flutter
  i18n_extension: ^15.1.0
  sqflite: ^2.3.3
  intl: ^0.20.2
  provider: ^6.1.2
  http: ^1.3.0
  uuid: ^4.5.1
  html: ^0.15.5
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  share_plus: ^12.0.2
  connectivity_plus: ^7.1.1
  flutter_displaymode: ^0.7.0
  quick_actions: ^1.1.0
  animated_list_plus: ^0.5.2
  dynamic_color: 1.8.1
  material_color_utilities: ^0.13.0
  crypto: ^3.0.6
  flutter_svg: ^2.0.17
  background_fetch: ^1.3.7
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  package_info_plus: ^9.0.0
  google_fonts: ^8.0.2
  get_it: ^9.2.1
  xml: ^6.5.0
  flutter_native_splash: ^2.4.4

dependency_overrides:
  intl: 0.20.2
  # Javított példány: a v1 Registrar API-t az új Flutter már nem ismeri
  image_crop_plus:
    path: ../third_party/image_crop_plus

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800

  assets:
    - assets/icons/ic_splash.png
    - assets/icons/ic_rounded.png
    - assets/images/
    - assets/svg/menu_icons/
    - assets/other/dirtywords.xml
    - assets/svg/
    - assets/svg/cover_arts/


flutter_launcher_icons:
  image_path: assets/icons/tinta_icon.png
  android: true
  adaptive_icon_background: "#2440C8"
  adaptive_icon_foreground: assets/icons/tinta_icon_fg.png
  adaptive_icon_monochrome: assets/icons/tinta_icon_mono.png
  ios: false
  remove_alpha_ios: false
  web:
    generate: false
  compress: true

flutter_native_splash:
  color: "#F6F7F9"
  image: assets/icons/tinta_splash.png
  color_dark: "#101218"
  image_dark: assets/icons/tinta_splash_dark.png
  android_12:
    image: assets/icons/tinta_splash.png
    color: "#F6F7F9"
    image_dark: assets/icons/tinta_splash_dark.png
    color_dark: "#101218"
  android: true
  android_gravity: center
  ios: false
  web: false
