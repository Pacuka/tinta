# Unsigned iOS build for sideloading (SideStore / AltStore sign it with the
# user's own Apple ID). Run manually, or automatically for v* tags (then the
# IPA is attached to the GitHub release).
name: iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: folio
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          # Several plugins are CocoaPods-only; mixing in SwiftPM makes
          # DKImagePickerController link twice.
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd ios && pod install --repo-update

      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry Tinta.ipa Payload
          ls -lh Tinta.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Tinta-ios
          path: folio/Tinta.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: folio/Tinta.ipa
